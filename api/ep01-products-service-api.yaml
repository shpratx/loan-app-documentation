openapi: 3.0.3
info:
  title: BridgeNow Products Service
  version: 0.1.0
  description: 'Product catalogue microservice for BridgeNow Finance.

    Manages finance product configuration, listing, and details.


    ## Standards

    - RFC 7807 errors, camelCase JSON, X-Correlation-Id

    - Public endpoints (no auth required for product browsing)

    '
servers:
- url: http://localhost:5002/api/v1
  description: Local development
- url: https://products.bridgenow.sa/api/v1
  description: Production
tags:
- name: Products
  description: Product catalogue and configuration
- name: Health
  description: Service health
paths:
  /products:
    get:
      operationId: listProducts
      summary: List all active finance products
      tags:
      - Products
      security: []
      x-data-sensitivity: Public
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: type
        in: query
        required: false
        description: Filter by product type
        schema:
          type: string
          enum:
          - BridgeNow
          - Cash
          - Combo
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Products listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
              examples:
                all_products:
                  summary: All active products
                  value:
                    data:
                    - id: 11111111-1111-1111-1111-111111111111
                      name: BridgeNow Finance
                      type: BridgeNow
                      minAmount: 4000
                      maxAmount: 30000
                      minTenureMonths: 24
                      maxTenureMonths: 24
                      profitRatePercent: 27.0
                      earlyClosureFeePercent: 0
                      adminFeePercent: 0.5
                      description: Easy Salary Advance for your immediate needs
                      keySellingPoint: No Early Closure Charges
                      isActive: true
                    - id: 22222222-2222-2222-2222-222222222222
                      name: Cash Finance
                      type: Cash
                      minAmount: 5000
                      maxAmount: 250000
                      minTenureMonths: 3
                      maxTenureMonths: 60
                      profitRatePercent: 20.0
                      earlyClosureFeePercent: 1.0
                      adminFeePercent: 1.5
                      description: Flexible personal finance
                      keySellingPoint: null
                      isActive: true
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '500':
          $ref: '#/components/responses/InternalError'
  /products/{productId}:
    get:
      operationId: getProduct
      summary: Get product details by ID
      tags:
      - Products
      security: []
      x-data-sensitivity: Public
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-1111-1111-111111111111
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      operationId: healthLiveness
      summary: Liveness probe
      tags:
      - Health
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Healthy
                  service:
                    type: string
                    example: products-service
      x-data-sensitivity: Public
  /health/ready:
    get:
      operationId: healthReadiness
      summary: Readiness probe
      tags:
      - Health
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Healthy
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: Healthy
                      cache:
                        type: string
                        example: Healthy
        '503':
          description: Not ready
      x-data-sensitivity: Public
components:
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      schema:
        type: string
        format: uuid
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: BridgeNow Finance
        type:
          type: string
          enum:
          - BridgeNow
          - Cash
          - Combo
        minAmount:
          type: number
          example: 4000
        maxAmount:
          type: number
          example: 30000
        minTenureMonths:
          type: integer
          example: 24
        maxTenureMonths:
          type: integer
          example: 24
        profitRatePercent:
          type: number
          example: 27.0
        earlyClosureFeePercent:
          type: number
          example: 0
        adminFeePercent:
          type: number
          example: 0.5
        description:
          type: string
          example: Easy Salary Advance for your immediate needs
        keySellingPoint:
          type: string
          nullable: true
          example: No Early Closure Charges
        isActive:
          type: boolean
          example: true
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: not-found
            title: Not Found
            status: 404
    InternalError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: internal-error
            title: Internal Server Error
            status: 500
